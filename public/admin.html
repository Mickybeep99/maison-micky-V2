<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Maison Micky — Administration</title><style>:root{--wine:#8e1637;--blue:#153d73;--red:#d62948;--cream:#f7f0e8;--ink:#17243a}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#eef2f8;color:var(--ink)}header{padding:20px 5%;background:linear-gradient(100deg,var(--wine),var(--blue));color:#fff;display:flex;justify-content:space-between;align-items:center}a{color:inherit}.wrap{padding:26px 5%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 28px #26365316}.table{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;white-space:nowrap}select,button{padding:9px;border-radius:9px;border:1px solid #ccd4e0}button{background:var(--wine);color:#fff;border:0;cursor:pointer}.badge{padding:5px 9px;border-radius:999px;background:#edf2fa;font-size:12px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><b>MAISON MICKY — ADMIN</b><a href="/">Voir la boutique</a></header><main class="wrap"><h1>Pilotage des ventes</h1><div id="stats" class="stats"></div><div class="table"><table><thead><tr><th>Commande</th><th>Client</th><th>Total</th><th>Paiement</th><th>Statut paiement</th><th>Livraison</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></main><script>async function patch(id,k,v){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({[k]:v})});load()}async function load(){let s=await(await fetch('/api/dashboard')).json();stats.innerHTML=[['Commandes',s.orders],['CA encaissé',s.revenue.toLocaleString('fr-FR')+' FCFA'],['Payées',s.paid],['À livrer',s.toDeliver]].map(x=>`<div class=card><small>${x[0]}</small><h2>${x[1]}</h2></div>`).join('');let o=await(await fetch('/api/orders')).json();orders.innerHTML=o.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.customer.name}<br><small>${x.customer.phone}</small></td><td>${x.total.toLocaleString('fr-FR')} FCFA</td><td>${x.payment_method}</td><td><span class=badge>${x.payment_status}</span></td><td><select onchange="patch('${x.id}','fulfillment_status',this.value)"><option ${x.fulfillment_status==='TO_PREPARE'?'selected':''}>TO_PREPARE</option><option ${x.fulfillment_status==='READY'?'selected':''}>READY</option><option ${x.fulfillment_status==='OUT_FOR_DELIVERY'?'selected':''}>OUT_FOR_DELIVERY</option><option ${x.fulfillment_status==='DELIVERED'?'selected':''}>DELIVERED</option></select></td><td>${x.payment_method==='cash'&&x.payment_status==='COD_PENDING'?`<button onclick="patch('${x.id}','payment_status','PAID')">Encaissement reçu</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Aucune commande.</td></tr>'}load()</script></body></html>
