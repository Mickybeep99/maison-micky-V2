<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Micky</title><style>:root{--wine:#8e1637;--blue:#153d73;--red:#d62948;--cream:#f7f0e8;--ink:#17243a}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#f7f0e8,#e8edf7);color:var(--ink)}header{padding:22px 5%;background:linear-gradient(100deg,var(--wine),var(--blue));color:#fff;display:flex;justify-content:space-between;align-items:center}.hero{padding:55px 6%;background:linear-gradient(120deg,#fff1f2,#e9f1ff)}h1{font-size:42px;max-width:650px}.accent{color:var(--wine)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;padding:28px 6%}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 30px #26365318}.price{font-weight:800;color:var(--wine)}button{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(90deg,var(--wine),var(--red));color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.cart-section{margin:20px 6% 60px;padding:26px;background:#f9fbff;border-top:5px solid var(--blue);border-radius:20px}.cart-line{background:#fff;margin:8px 0;padding:12px;border-radius:12px}.pay{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:20px;background:#e8effb}.pill.wave{color:#0759bd}.pill.om{color:#c44a13}.pill.cash{color:#28724a}input,select{padding:12px;margin:4px;border-radius:10px;border:1px solid #ccd4e0;font-size:15px}#msg{font-weight:700;margin-top:15px}.success{color:#28724a}.error{color:#b42318}@media(max-width:700px){h1{font-size:32px}header{flex-direction:column;align-items:flex-start}input,select{width:100%;margin:5px 0}}</style></head><body><header><b>MAISON MICKY</b><span>Parfums d'exception</span></header><section class="hero"><h1>Des parfums qui racontent <span class="accent">votre histoire</span></h1><p>Découvrez notre sélection de parfums d'exception.</p><div class="pay"><span class="pill wave">Wave</span><span class="pill om">Orange Money</span><span class="pill cash">Espèces à la livraison</span></div></section><main><div id="products" class="grid">Chargement du catalogue...</div><section class="cart-section"><h2>Panier (<span id="count">0</span>)</h2><div id="cart">Votre panier est vide.</div><h3>Finaliser la commande</h3><p><input id="name" type="text" placeholder="Nom et prénom" autocomplete="name"><input id="phone" type="tel" placeholder="Téléphone" autocomplete="tel"><input id="address" type="text" placeholder="Adresse de livraison" autocomplete="street-address"></p><p><select id="payment"><option value="cash">Espèces à la livraison</option><option value="wave">Wave</option><option value="orange_money">Orange Money</option></select> <button id="checkoutButton" type="button" onclick="checkout()">Confirmer la commande</button></p><p id="msg"></p></section></main><script>let catalog=[],basket={};function el(id){return document.getElementById(id)}function showMessage(text,error=false){let m=el("msg");m.textContent=text;m.className=error?"error":"success"}function add(id){let p=catalog.find(x=>x.id===id);if(!p||Number(p.stock)<=0)return;let q=basket[id]||0;if(q>=Number(p.stock))return showMessage("La quantité demandée dépasse le stock disponible.",true);basket[id]=q+1;renderCart()}function removeOne(id){if(!basket[id])return;basket[id]--;if(basket[id]<=0)delete basket[id];renderCart()}function renderCart(){let rows=Object.entries(basket).map(([id,q])=>{let p=catalog.find(x=>x.id===id);if(!p)return"";return `<div class="cart-line"><strong>${p.name}</strong> × ${q} — ${(Number(p.price)*q).toLocaleString("fr-FR")} FCFA <button type="button" onclick="removeOne('${id}')">−</button></div>`});el("cart").innerHTML=rows.join("")||"Votre panier est vide.";el("count").textContent=Object.values(basket).reduce((a,b)=>a+b,0)}async function checkout(){let nameInput=el("name"),phoneInput=el("phone"),addressInput=el("address"),paymentInput=el("payment"),button=el("checkoutButton");if(!Object.keys(basket).length)return showMessage("Ajoutez au moins un parfum.",true);let name=nameInput?.value?.trim()||"",phone=phoneInput?.value?.trim()||"",address=addressInput?.value?.trim()||"";if(!name){showMessage("Veuillez renseigner votre nom.",true);return nameInput?.focus()}if(!phone){showMessage("Veuillez renseigner votre numéro de téléphone.",true);return phoneInput?.focus()}if(!address){showMessage("Veuillez renseigner votre adresse de livraison.",true);return addressInput?.focus()}let payload={customer:{name,phone,address},items:Object.entries(basket).map(([product_id,qty])=>({product_id,qty})),payment_method:paymentInput.value};button.disabled=true;button.textContent="Traitement...";showMessage("Enregistrement de la commande...");try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),j;try{j=await r.json()}catch(e){throw new Error("Réponse invalide du serveur.")}if(!r.ok)throw new Error(j.error||"Impossible d'enregistrer la commande.");if(!j.order)throw new Error("La commande n'a pas été retournée par le serveur.");let total=Number(j.order.total||0),confirmation=`Commande ${j.order.id} enregistrée — ${total.toLocaleString("fr-FR")} FCFA.`;if(j.checkout?.message)confirmation+=" "+j.checkout.message;else if(paymentInput.value==="cash")confirmation+=" Paiement en espèces à la livraison.";showMessage(confirmation);basket={};renderCart();nameInput.value="";phoneInput.value="";addressInput.value="";await loadProducts()}catch(e){console.error(e);showMessage("Erreur : "+e.message,true)}finally{button.disabled=false;button.textContent="Confirmer la commande"}}async function loadProducts(){let box=el("products");try{let r=await fetch("/api/products");if(!r.ok)throw new Error("Catalogue indisponible.");let p=await r.json();catalog=Array.isArray(p)?p:[];if(!catalog.length){box.innerHTML="<p>Aucun parfum disponible actuellement.</p>";return}box.innerHTML=catalog.map(x=>{let stock=Number(x.stock||0),price=Number(x.price||0);return `<article class="card"><h3>${x.name}</h3><p>${x.size||""}</p><p class="price">${price.toLocaleString("fr-FR")} FCFA</p><p>${stock>0?"En stock : "+stock:"Épuisé"}</p><button type="button" ${stock<=0?"disabled":""} onclick="add('${x.id}')">${stock>0?"Ajouter au panier":"Épuisé"}</button></article>`}).join("")}catch(e){console.error(e);box.innerHTML='<div class="card">Impossible de charger le catalogue.</div>'}}loadProducts();renderCart();</script></body></html>
